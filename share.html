<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>10space — Sdílený soubor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
    }
    .hidden { display: none !important; }

    /* HEADER */
    .page-header {
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 1px solid #e5e5ea;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    .page-header-back {
      background: none;
      border: none;
      cursor: pointer;
      color: #1c1c1e;
      display: flex;
      align-items: center;
      padding: 4px;
      flex-shrink: 0;
    }
    .page-header-title { font-size: 15px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page-header-logo { font-size: 15px; font-weight: 700; }
    .page-header-logo span { color: #EE220C; }

    .page-content { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
    .pin-page-content { max-width: 380px; margin: 60px auto 0; padding: 0 20px; text-align: center; }

    .logo { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .logo span { color: #EE220C; }
    .subtitle { font-size: 13px; color: #8e8e93; margin-bottom: 24px; }

    .pin-input {
      width: 100%;
      padding: 14px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 8px;
      border: 1px solid #e5e5ea;
      border-radius: 10px;
      outline: none;
      margin-bottom: 16px;
    }
    .pin-input:focus { border-color: #EE220C; }

    .primary-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: #EE220C;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .primary-btn:hover { background: #cc1a09; }

    .error { color: #EE220C; font-size: 14px; margin-top: 12px; }

    /* FILE DETAIL */
    .file-detail-card {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    .file-icon { margin-bottom: 16px; }
    .file-name { font-size: 16px; font-weight: 600; margin-bottom: 24px; word-break: break-word; }

    .action-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      background: #f2f2f7;
      color: #1c1c1e;
      border: 1px solid #e5e5ea;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .action-btn:hover { background: #e5e5ea; }
    .action-btn:last-child { margin-bottom: 0; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e5ea;
      border-top-color: #EE220C;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* EXPLORER */
    .explorer-list {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    .explorer-item {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      cursor: pointer; border-bottom: 1px solid #f2f2f7;
    }
    .explorer-item:hover { background: #f9f9fb; }
    .explorer-item:last-child { border-bottom: none; }
    .explorer-item-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .explorer-empty { padding: 40px 20px; text-align: center; color: #8e8e93; font-size: 14px; background: #fff; border-radius: 12px; }

    /* PDF VIEWER */
    .pdf-overlay {
      position: fixed; inset: 0; background: #1c1c1e; z-index: 3000;
      display: flex; flex-direction: column;
    }
    .pdf-overlay.hidden { display: none; }
    .pdf-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; height: 52px; background: #2c2c2e; flex-shrink: 0; gap: 8px;
    }
    .pdf-btn {
      width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.1);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0;
    }
    .pdf-btn:hover { background: rgba(255,255,255,0.2); }
    .pdf-title { font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: center; }
    .pdf-canvas-wrap {
      flex: 1; overflow-y: auto; overflow-x: auto; padding: 16px;
      -webkit-overflow-scrolling: touch; display: block;
    }

    .share-section {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e5e5ea;
      margin-bottom: 16px;
    }
    .share-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .share-info-row { display: flex; justify-content: flex-start; gap: 12px; padding: 6px 0; border-bottom: 1px solid #f2f2f7; font-size: 14px; }
    .share-info-row:last-child { border-bottom: none; }
    .share-info-row span:first-child { color: #8e8e93; flex-shrink: 0; width: 90px; }
    .share-info-row span:last-child { color: #1c1c1e; text-align: left; }
    .share-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .share-table th {
      background: #f2f2f7;
      padding: 6px 10px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: #6e6e73;
      border: 1px solid #e5e5ea;
    }
    .share-table td {
      padding: 6px 10px;
      border: 1px solid #e5e5ea;
      color: #1c1c1e;
      vertical-align: top;
    }

    /* ── Sjednocený vzhled s 10base a 10space: plochy bez okrajů, velké zaoblení, jemný stín, tmavý režim podle systému ── */
    :root {
      --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #8e8e93; --hair: rgba(60, 60, 67, 0.12);
      --surface-2: rgba(120, 120, 128, 0.12); --accent: #EE220C; --accent-press: #cc1a09;
      --r-card: 18px; --r-ctl: 14px;
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 22px rgba(0, 0, 0, 0.06);
      --ease: cubic-bezier(0.22, 0.8, 0.28, 1); --spring: cubic-bezier(0.2, 1.2, 0.3, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --card: #151517; --text: #ececee; --muted: #8e8e93; --hair: rgba(255, 255, 255, 0.08); --surface-2: #222225; --shadow-card: none; }
    }
    html { background: var(--bg); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

    .page-header { background: color-mix(in srgb, var(--card) 82%, transparent); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); border-bottom: 1px solid var(--hair); padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); }
    .page-header-back { width: 36px; height: 36px; justify-content: center; border-radius: 50%; color: var(--text); transition: background 0.15s ease, transform 0.14s var(--spring); }
    .page-header-back:hover { background: var(--surface-2); }
    .page-header-back:active { transform: scale(0.88); }
    .page-header-title { color: var(--text); letter-spacing: -0.01em; }
    .page-header-logo, .logo { letter-spacing: -0.03em; color: var(--text); }
    .page-content { padding: 20px 16px calc(28px + env(safe-area-inset-bottom)); animation: shIn 0.34s var(--ease) both; }
    @keyframes shIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .pin-page-content { width: calc(100% - 32px); margin-top: 12vh; padding: 28px 22px 24px; background: var(--card); border-radius: 24px; box-shadow: var(--shadow-card); animation: shIn 0.4s var(--ease) both; }
    .logo { font-size: 30px; }
    .subtitle { color: var(--muted); font-size: 14px; }
    .pin-input { border: 2px solid transparent; background: var(--surface-2); color: var(--text); border-radius: var(--r-ctl); transition: border-color 0.15s ease, box-shadow 0.2s ease, background 0.15s ease; }
    .pin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(238, 34, 12, 0.14); background: var(--card); }
    .primary-btn { min-height: 48px; border-radius: var(--r-ctl); background: var(--accent); transition: background 0.2s ease, transform 0.14s var(--ease), box-shadow 0.2s ease; }
    @media (hover: hover) { .primary-btn:hover { background: var(--accent-press); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(238, 34, 12, 0.28); } }
    .primary-btn:active { transform: scale(0.97); box-shadow: none; }
    .error { color: var(--accent); }
    .pin-error-shake { animation: shShake 0.36s ease; }
    @keyframes shShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    .file-detail-card, .explorer-list, .explorer-empty, .share-section { background: var(--card); border: 0; border-radius: var(--r-card); box-shadow: var(--shadow-card); }
    .file-detail-card { padding: 32px 24px 24px; }
    .file-icon { display: inline-flex; width: 76px; height: 76px; align-items: center; justify-content: center; border-radius: 22px; background: var(--surface-2); }
    .file-name { color: var(--text); font-size: 17px; letter-spacing: -0.01em; }
    .action-btn { min-height: 48px; border: 0; border-radius: var(--r-ctl); background: var(--surface-2); color: var(--text); transition: background 0.15s ease, transform 0.14s var(--ease); }
    .action-btn:hover { background: color-mix(in srgb, var(--surface-2) 70%, var(--muted)); }
    .action-btn:active { transform: scale(0.97); }
    #view-btn:not(.hidden), #view-btn.hidden + .action-btn { background: var(--accent); color: #fff; }
    #view-btn:not(.hidden):hover, #view-btn.hidden + .action-btn:hover { background: var(--accent-press); }

    .explorer-item { border-bottom: 1px solid var(--hair); padding: 14px 16px; transition: background 0.15s ease, transform 0.14s var(--ease); }
    .explorer-item:hover { background: var(--surface-2); }
    .explorer-item:active { transform: scale(0.99); }
    .explorer-item-name { color: var(--text); }
    .explorer-empty { color: var(--muted); }
    .spinner { border-color: var(--surface-2); border-top-color: var(--accent); }

    .share-section { padding: 18px; }
    .share-section-title { color: var(--muted); letter-spacing: 0.06em; }
    .share-info-row { border-bottom: 1px solid var(--hair); }
    .share-info-row span:last-child { color: var(--text); }
    .share-table { border-collapse: separate; border-spacing: 0; overflow: hidden; border-radius: 12px; }
    .share-table th { background: var(--surface-2); color: var(--muted); border: 0; border-bottom: 1px solid var(--hair); }
    .share-table td { border: 0; border-bottom: 1px solid var(--hair); color: var(--text); }
    .share-table tr:last-child td { border-bottom: 0; }

    .pdf-toolbar { background: rgba(28, 28, 30, 0.9); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); padding-top: env(safe-area-inset-top); height: calc(52px + env(safe-area-inset-top)); }
    .pdf-btn { border-radius: 50%; transition: background 0.15s ease, transform 0.14s var(--spring); }
    .pdf-btn:active { transform: scale(0.88); }
    .pdf-overlay:not(.hidden) { animation: shFade 0.22s ease both; }
    @keyframes shFade { from { opacity: 0; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
  <link rel="stylesheet" href="ui.css">
  <script src="ui.js"></script>
</head>
<body>

  <!-- PIN PAGE -->
  <div id="page-pin">
    <div class="pin-page-content">
      <div class="logo">10<span>space</span></div>
      <div class="subtitle">Sdílený soubor — zadejte PIN kód</div>
      <input type="text" class="pin-input" id="pin-input" maxlength="6" placeholder="••••" inputmode="numeric">
      <button class="primary-btn" onclick="verifyPin()">Otevřít</button>
      <p class="error hidden" id="pin-error"></p>
    </div>
  </div>

  <!-- LOADING PAGE -->
  <div id="page-loading" class="hidden">
    <div class="spinner"></div>
  </div>

  <!-- EXPLORER PAGE -->
  <div id="page-explorer" class="hidden">
    <div class="page-header">
      <button class="page-header-back hidden" id="explorer-back-btn" onclick="explorerGoBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="page-header-title" id="explorer-title"></span>
      <span class="page-header-logo">10<span>space</span></span>
    </div>
    <div class="page-content">
      <div class="explorer-list" id="explorer-list"></div>
    </div>
  </div>

  <!-- FILE DETAIL PAGE -->
  <div id="page-file" class="hidden">
    <div class="page-header">
      <button class="page-header-back" id="file-back-btn" onclick="fileGoBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="page-header-title">Soubor</span>
      <span class="page-header-logo">10<span>space</span></span>
    </div>
    <div class="page-content">
      <div class="file-detail-card">
        <div class="file-icon" id="file-icon"></div>
        <div class="file-name" id="file-name"></div>
        <button class="action-btn" id="view-btn" onclick="viewFile()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Zobrazit
        </button>
        <button class="action-btn" onclick="downloadFile()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Stáhnout
        </button>
      </div>
    </div>
  </div>

  <!-- PDF VIEWER -->
  <div class="pdf-overlay hidden" id="pdf-overlay">
    <div class="pdf-toolbar">
      <button class="pdf-btn" onclick="closePdfViewer()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <span class="pdf-title" id="pdf-title"></span>
      <div style="width:36px"></div>
    </div>
    <div class="pdf-canvas-wrap" id="pdf-canvas-wrap"></div>
  </div>

  <!-- PROJEKT PAGE -->
  <div id="page-projekt" class="hidden">
    <div class="page-header">
      <span class="page-header-title" id="projekt-share-title"></span>
      <span class="page-header-logo">10<span>space</span></span>
    </div>
    <div class="page-content">
      <div id="projekt-share-body"></div>
    </div>
  </div>

  <script>
    const FUNCTIONS = {
      verifyShareToken: "https://verifysharetoken-etp6s2ynnq-uc.a.run.app",
      getFileStream: "https://getfilestream-etp6s2ynnq-uc.a.run.app",
      listSharedFolder: "https://listsharedfolder-etp6s2ynnq-uc.a.run.app",
      getSharedProjekt: "https://getsharedprojekt-etp6s2ynnq-uc.a.run.app"
    };

    const shareToken = new URLSearchParams(window.location.search).get("token");

    let rootData = null; // co bylo nasdíleno (soubor nebo složka)
    let explorerPath = []; // [{id, name}] — historie navigace ve složce
    let explorerCameFromProjekt = false;
    let fileData = null; // aktuálně zobrazovaný soubor v detailu
    let cameFromExplorer = false; // jestli se detail souboru otevřel z explorer

    function showPage(id) {
      ["page-pin", "page-loading", "page-explorer", "page-file", "page-projekt"].forEach(p => {
        document.getElementById(p).classList.toggle("hidden", p !== id);
      });
    }

    window.verifyPin = async () => {
      const pin = document.getElementById("pin-input").value;
      if (!pin) return;

      showPage("page-loading");
      document.getElementById("pin-error").classList.add("hidden");

      try {
        const res = await fetch(FUNCTIONS.verifyShareToken, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: shareToken, pin })
        });
        const data = await res.json();

        if (data.success) {
            rootData = data;
          
            if (data.type === "projekt") {
              showPage("page-projekt");
              loadSharedProjekt();
            } else if (data.mimeType === "application/vnd.google-apps.folder") {
              explorerPath = [{ id: data.driveFileId, name: data.nazev }];
              showPage("page-explorer");
              loadSharedFolder(data.driveFileId, data.nazev);
            } else {
              fileData = data;
              cameFromExplorer = false;
              document.getElementById("file-back-btn").classList.add("hidden");
              showFileDetail(data.nazev, data.mimeType);
            }
          } else {
          showPage("page-pin");
          document.getElementById("pin-error").textContent = data.error || "Chyba";
          document.getElementById("pin-error").classList.remove("hidden");
          const pi = document.getElementById("pin-input"); pi.classList.remove("pin-error-shake"); void pi.offsetWidth; pi.classList.add("pin-error-shake");
        }
      } catch(err) {
        showPage("page-pin");
        document.getElementById("pin-error").textContent = "Chyba připojení: " + err.message;
        document.getElementById("pin-error").classList.remove("hidden");
      }
    };

    document.getElementById("pin-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") verifyPin();
    });

    function getFileIconSvg(mimeType, size) {
      const s = size || 48;
      const mime = (mimeType || "").toLowerCase();
      if (mime === "application/vnd.google-apps.folder") {
        return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#EE220C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
      }
      if (mime.includes("pdf")) {
        return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#EE220C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
      }
      if (mime.includes("image")) {
        return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
      }
      return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
    }

    // ===== EXPLORER =====
    async function loadSharedFolder(folderId, folderName) {
      document.getElementById("explorer-title").textContent = folderName;
      document.getElementById("explorer-back-btn").classList.toggle("hidden", explorerPath.length <= 1 && !explorerCameFromProjekt);
      document.getElementById("explorer-list").innerHTML = `<div class="explorer-empty"><div class="spinner"></div></div>`;

      try {
        const res = await fetch(FUNCTIONS.listSharedFolder, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shareToken, folderId })
        });
        const data = await res.json();

        if (!data.success) {
          document.getElementById("explorer-list").innerHTML = `<div class="explorer-empty">Chyba: ${data.error}</div>`;
          return;
        }

        if (data.files.length === 0) {
          document.getElementById("explorer-list").innerHTML = `<div class="explorer-empty">Složka je prázdná</div>`;
          return;
        }

        const sorted = data.files.sort((a, b) => {
          if (a.isFolder && !b.isFolder) return -1;
          if (!a.isFolder && b.isFolder) return 1;
          return a.name.localeCompare(b.name, "cs");
        });

        document.getElementById("explorer-list").innerHTML = sorted.map(f => `
          <div class="explorer-item" onclick="${f.isFolder ? `openSharedSubfolder('${f.id}', '${f.name.replace(/'/g, "\\'")}')` : `openSharedFile('${f.id}', '${f.name.replace(/'/g, "\\'")}', '${f.mimeType}')`}">
            ${getFileIconSvg(f.isFolder ? "application/vnd.google-apps.folder" : f.mimeType, 20)}
            <span class="explorer-item-name">${f.name}</span>
          </div>
        `).join("");
      } catch(err) {
        document.getElementById("explorer-list").innerHTML = `<div class="explorer-empty">Chyba: ${err.message}</div>`;
      }
    }

    window.openSharedSubfolder = (folderId, folderName) => {
      explorerPath.push({ id: folderId, name: folderName });
      loadSharedFolder(folderId, folderName);
    };

    window.explorerGoBack = () => {
      if (explorerPath.length <= 1) {
        if (explorerCameFromProjekt) {
          explorerCameFromProjekt = false;
          showPage("page-projekt");
        }
        return;
      }
      explorerPath.pop();
      const target = explorerPath[explorerPath.length - 1];
      loadSharedFolder(target.id, target.name);
    };

    window.openSharedFile = (fileId, fileName, mimeType) => {
      fileData = { driveFileId: fileId, nazev: fileName, mimeType };
      cameFromExplorer = true;
      document.getElementById("file-back-btn").classList.remove("hidden");
      showFileDetail(fileName, mimeType);
    };

    // ===== FILE DETAIL =====
    function showFileDetail(name, mimeType) {
      showPage("page-file");
      document.getElementById("file-name").textContent = name;
      document.getElementById("file-icon").innerHTML = getFileIconSvg(mimeType);
      document.getElementById("view-btn").classList.toggle("hidden", mimeType !== "application/pdf");
    }

    window.fileGoBack = () => {
      if (cameFromExplorer) {
        showPage("page-explorer");
      } else {
        showPage("page-pin");
        document.getElementById("pin-input").value = "";
      }
    };

    window.downloadFile = async () => {
      if (!fileData) return;
      try {
        const url = `${FUNCTIONS.getFileStream}?driveFileId=${fileData.driveFileId}&shareToken=${shareToken}`;
        const response = await fetch(url);
        const blob = await response.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileData.nazev;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch(err) {
        alert("Chyba při stahování: " + err.message);
      }
    };

    // ===== PDF VIEWER =====
    let pdfDoc = null;
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    window.viewFile = async () => {
      if (!fileData) return;
      document.getElementById("pdf-title").textContent = fileData.nazev;
      document.getElementById("pdf-overlay").classList.remove("hidden");
      document.getElementById("pdf-canvas-wrap").innerHTML = `<div style="color:#fff;text-align:center;padding:40px">Načítám...</div>`;

      try {
        const url = `${FUNCTIONS.getFileStream}?driveFileId=${fileData.driveFileId}&shareToken=${shareToken}`;
        const loadingTask = pdfjsLib.getDocument({ url });
        pdfDoc = await loadingTask.promise;

        const wrap = document.getElementById("pdf-canvas-wrap");
        wrap.innerHTML = "";

        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const page = await pdfDoc.getPage(i);
          const viewport = page.getViewport({ scale: 1.0 });
          const availableWidth = wrap.clientWidth - 32;
          const scale = availableWidth / viewport.width;
          const scaledViewport = page.getViewport({ scale });

          const pageWrap = document.createElement("div");
          pageWrap.style.cssText = "margin-bottom:12px;display:flex;justify-content:center";

          const canvas = document.createElement("canvas");
          const dpr = window.devicePixelRatio || 1;
          canvas.width = scaledViewport.width * dpr;
          canvas.height = scaledViewport.height * dpr;
          canvas.style.width = scaledViewport.width + "px";
          canvas.style.height = scaledViewport.height + "px";
          canvas.style.boxShadow = "0 4px 24px rgba(0,0,0,0.4)";

          const ctx = canvas.getContext("2d");
          ctx.scale(dpr, dpr);
          await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;

          pageWrap.appendChild(canvas);
          wrap.appendChild(pageWrap);
        }
      } catch(err) {
        document.getElementById("pdf-canvas-wrap").innerHTML = `<div style="color:#ff6b6b;text-align:center;padding:40px">Chyba: ${err.message}</div>`;
      }
    };

    window.closePdfViewer = () => {
      document.getElementById("pdf-overlay").classList.add("hidden");
      pdfDoc = null;
    };

    // ===== NASDÍLENÉ PROJEKTY =====
    async function loadSharedProjekt() {
      document.getElementById("projekt-share-title").textContent = rootData.nazev || "Projekt";
      document.getElementById("projekt-share-body").innerHTML = `<div class="loading-spinner"></div>`;
    
      try {
        const res = await fetch(FUNCTIONS.getSharedProjekt, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shareToken })
        });
        const data = await res.json();
    
        if (!data.success) {
          document.getElementById("projekt-share-body").innerHTML = `<p>Chyba: ${data.error}</p>`;
          return;
        }
    
        const datum = data.datum ? new Date(data.datum).toLocaleDateString("cs-CZ", { day: "numeric", month: "long", year: "numeric" }) : "—";
    
        let infoHtml = `
          <div class="share-section">
            <div class="share-section-title">Informace o akci</div>
            <div class="share-info-row"><span>Datum</span><span>${datum}</span></div>
            ${data.misto ? `<div class="share-info-row"><span>Místo</span><span>${data.misto}</span></div>` : ""}
            ${data.sraz ? `<div class="share-info-row"><span>Sraz</span><span>${data.sraz}</span></div>` : ""}
            ${data.doprava ? `<div class="share-info-row"><span>Doprava</span><span>${data.doprava}</span></div>` : ""}
            ${data.garant ? `<div class="share-info-row"><span>Garant</span><span>${data.garant}</span></div>` : ""}
          </div>`;
    
        let wikiHtml = data.wikiText ? `
          <div class="share-section">
            <div class="share-section-title">O akci</div>
            <p>${data.wikiText}</p>
          </div>` : "";
    
        let timelineHtml = "";
        if (data.timeline?.length) {
          timelineHtml = `
            <div class="share-section">
              <div class="share-section-title">Harmonogram</div>
              ${data.timeline.map(t => `<div class="share-info-row"><span>${t.cas || "—"}</span><span>${t.popis || ""}</span></div>`).join("")}
            </div>`;
        }
    
        let riderHtml = "";
        if (data.harmonogramKoncertu?.length) {
          riderHtml = `
            <div class="share-section">
              <div class="share-section-title">Program koncertu</div>
              <table class="share-table">
                <thead><tr><th>Název</th><th>Detail</th><th>Stopáž</th></tr></thead>
                <tbody>
                  ${data.harmonogramKoncertu.map(r => {
                    const detail = r.skladby ? r.skladby.map(s => s.name).join(", ") : (r.moderatorJmeno || "");
                    return `<tr><td>${r.nazev || "—"}</td><td>${detail}</td><td>${r.stopaz_min ? r.stopaz_min + " min" : "—"}</td></tr>`;
                  }).join("")}
                </tbody>
              </table>
            </div>`;
        }
    
        let podkladyHtml = data.hasPodklady ? `
          <div class="share-section">
            <button class="primary-btn" onclick="openProjektPodklady()">Otevřít podklady</button>
          </div>` : "";
    
        document.getElementById("projekt-share-body").innerHTML = infoHtml + wikiHtml + timelineHtml + riderHtml + podkladyHtml;
      } catch(err) {
        document.getElementById("projekt-share-body").innerHTML = `<p>Chyba připojení: ${err.message}</p>`;
      }
    }
    
    window.openProjektPodklady = () => {
      explorerCameFromProjekt = true;
      explorerPath = [{ id: rootData.driveFileId || null, name: "Podklady" }];
      loadSharedFolder(explorerPath[0].id, "Podklady");
      showPage("page-explorer");
      document.getElementById("file-back-btn")?.classList.add("hidden");
    };
  </script>
</body>
</html>
