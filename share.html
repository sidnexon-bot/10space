<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>10space — Sdílený obsah</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
    }
    .hidden { display: none !important; }

    /* HEADER */
    .page-header {
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 1px solid #e5e5ea;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    .page-header-back {
      background: none;
      border: none;
      cursor: pointer;
      color: #1c1c1e;
      display: flex;
      align-items: center;
      padding: 4px;
      flex-shrink: 0;
    }
    .page-header-title { font-size: 15px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page-header-logo { font-size: 15px; font-weight: 700; }
    .page-header-logo span { color: #EE220C; }

    .page-content { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
    .pin-page-content { max-width: 380px; margin: 60px auto 0; padding: 0 20px; text-align: center; }

    .logo { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .logo span { color: #EE220C; }
    .subtitle { font-size: 13px; color: #8e8e93; margin-bottom: 24px; }

    .pin-input {
      width: 100%;
      padding: 14px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 8px;
      border: 1px solid #e5e5ea;
      border-radius: 10px;
      outline: none;
      margin-bottom: 16px;
    }
    .pin-input:focus { border-color: #EE220C; }

    .primary-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: #EE220C;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .primary-btn:hover { background: #cc1a09; }

    .error { color: #EE220C; font-size: 14px; margin-top: 12px; }

    /* FILE DETAIL */
    .file-detail-card {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    .file-icon { margin-bottom: 16px; }
    .file-name { font-size: 16px; font-weight: 600; margin-bottom: 24px; word-break: break-word; }

    .action-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      background: #f2f2f7;
      color: #1c1c1e;
      border: 1px solid #e5e5ea;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .action-btn:hover { background: #e5e5ea; }
    .action-btn:last-child { margin-bottom: 0; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e5ea;
      border-top-color: #EE220C;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* EXPLORER */
    .explorer-list {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    .explorer-item {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      cursor: pointer; border-bottom: 1px solid #f2f2f7;
    }
    .explorer-item:hover { background: #f9f9fb; }
    .explorer-item:last-child { border-bottom: none; }
    .explorer-item-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .explorer-empty { padding: 40px 20px; text-align: center; color: #8e8e93; font-size: 14px; background: #fff; border-radius: 12px; }

    /* PDF VIEWER */
    .pdf-overlay {
      position: fixed; inset: 0; background: #1c1c1e; z-index: 3000;
      display: flex; flex-direction: column;
    }
    .pdf-overlay.hidden { display: none; }
    .pdf-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; height: 52px; background: #2c2c2e; flex-shrink: 0; gap: 8px;
    }
    .pdf-btn {
      width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.1);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0;
    }
    .pdf-btn:hover { background: rgba(255,255,255,0.2); }
    .pdf-title { font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: center; }
    .pdf-canvas-wrap {
      flex: 1; overflow-y: auto; overflow-x: auto; padding: 16px;
      -webkit-overflow-scrolling: touch; display: block;
    }

    .share-section {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e5e5ea;
      margin-bottom: 16px;
    }
    .share-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .share-info-row { display: flex; justify-content: flex-start; gap: 12px; padding: 6px 0; border-bottom: 1px solid #f2f2f7; font-size: 14px; }
    .share-info-row:last-child { border-bottom: none; }
    .share-info-row span:first-child { color: #8e8e93; flex-shrink: 0; width: 90px; }
    .share-info-row span:last-child { color: #1c1c1e; text-align: left; }
    .share-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .share-table th {
      background: #f2f2f7;
      padding: 6px 10px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: #6e6e73;
      border: 1px solid #e5e5ea;
    }
    .share-table td {
      padding: 6px 10px;
      border: 1px solid #e5e5ea;
      color: #1c1c1e;
      vertical-align: top;
    }

    /* ── Vzhled portálu: sjednocený s 10base a 10space (plochy bez okrajů, zaoblení, jemný stín, tmavý režim podle systému) ── */
    :root {
      --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #6e6e73; --hair: rgba(60, 60, 67, 0.12);
      --surface-2: rgba(120, 120, 128, 0.12); --accent: #EE220C; --accent-press: #cc1a09;
      --r-card: 16px; --r-ctl: 12px;
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
      --ease: cubic-bezier(0.22, 0.8, 0.28, 1); --spring: cubic-bezier(0.2, 1.2, 0.3, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --card: #151517; --text: #ececee; --muted: #9a9aa0; --hair: rgba(255, 255, 255, 0.09); --surface-2: #222225; --shadow-card: none; }
    }
    html { background: var(--bg); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
    body > div[id^="page-"]:not(.hidden) { flex: 1; }
    .site-foot { padding: 20px 24px calc(20px + env(safe-area-inset-bottom)); text-align: center; font-size: 12px; color: var(--muted); }
    .site-foot b { color: var(--text); font-weight: 600; }

    /* Horní lišta: značka vlevo, název sdíleného obsahu, vpravo popisek */
    .page-header { background: color-mix(in srgb, var(--card) 86%, transparent); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
      border-bottom: 1px solid var(--hair); padding: 0 max(24px, calc((100vw - 1040px) / 2 + 24px)); min-height: 60px; padding-top: env(safe-area-inset-top); gap: 12px; }
    .page-header-logo { order: -1; font-size: 20px; letter-spacing: -0.03em; color: var(--text); line-height: 28px; }
    .page-header:has(.page-header-back:not(.hidden)) .page-header-logo { padding-right: 14px; margin-right: 2px; border-right: 1px solid var(--hair); }
    .page-header-back { order: 0; width: 36px; height: 36px; justify-content: center; border-radius: 50%; color: var(--text); transition: background 0.15s ease, transform 0.14s var(--spring); }
    .page-header-back:hover { background: var(--surface-2); }
    .page-header-back:active { transform: scale(0.88); }
    .page-header-title { order: 1; color: var(--muted); font-size: 14px; font-weight: 500; }
    #explorer-title, #projekt-share-title { display: none; }
    .page-header::after { content: "Sdílený obsah"; order: 2; margin-left: auto; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; white-space: nowrap; }
    .page-content { max-width: 1040px; padding: 32px 24px calc(24px + env(safe-area-inset-bottom)); animation: shIn 0.34s var(--ease) both; }
    @keyframes shIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .page-title { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; margin: 0 0 6px; word-break: break-word; }
    .page-sub { font-size: 14px; color: var(--muted); margin-bottom: 22px; }

    /* Vstup s PINem */
    .logo { font-size: 32px; letter-spacing: -0.03em; color: var(--text); }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    #page-pin { display: flex; align-items: center; justify-content: center; padding: 24px 0; }
    .pin-page-content { width: calc(100% - 32px); max-width: 400px; margin: 0 auto; padding: 36px 32px 28px; background: var(--card); border-radius: 20px; box-shadow: var(--shadow-card); animation: shIn 0.4s var(--ease) both; }
    .pin-input { border: 2px solid transparent; background: var(--surface-2); color: var(--text); border-radius: var(--r-ctl); transition: border-color 0.15s ease, box-shadow 0.2s ease, background 0.15s ease; }
    .pin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(238, 34, 12, 0.14); background: var(--card); }
    .primary-btn { min-height: 46px; border-radius: var(--r-ctl); background: var(--accent); transition: background 0.2s ease, transform 0.14s var(--ease), box-shadow 0.2s ease; }
    @media (hover: hover) { .primary-btn:hover { background: var(--accent-press); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(238, 34, 12, 0.28); } }
    .primary-btn:active { transform: scale(0.98); box-shadow: none; }
    .error { color: var(--accent); }
    .pin-error-shake { animation: shShake 0.36s ease; }
    @keyframes shShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    .spinner { border-color: var(--surface-2); border-top-color: var(--accent); }

    /* Složka: cesta + seznam */
    .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .crumbs button { border: 0; background: none; font: inherit; color: var(--muted); cursor: pointer; padding: 3px 6px; border-radius: 8px; transition: background 0.15s ease, color 0.15s ease; }
    .crumbs button:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
    .crumbs button:disabled { color: var(--text); font-weight: 600; cursor: default; }
    .crumbs .sep { opacity: 0.5; }
    .explorer-list, .explorer-empty { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow-card); overflow: hidden; }
    .explorer-head { display: grid; grid-template-columns: 1fr 120px 28px; gap: 14px; padding: 10px 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--hair); }
    .explorer-item { display: grid; grid-template-columns: 36px 1fr 120px 28px; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--hair); cursor: pointer; transition: background 0.15s ease; }
    .explorer-head { grid-template-columns: 50px 1fr 120px 28px; }
    .explorer-item:last-child { border-bottom: 0; }
    .explorer-item:hover { background: var(--surface-2); }
    .explorer-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .explorer-item .ic { display: flex; align-items: center; justify-content: center; }
    .explorer-item-name { color: var(--text); font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .explorer-item-type { font-size: 13px; color: var(--muted); }
    .explorer-item .chev { color: var(--muted); opacity: 0.6; transition: transform 0.15s var(--ease), opacity 0.15s ease; }
    .explorer-item:hover .chev { transform: translateX(3px); opacity: 1; }
    .explorer-empty { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 14px; }
    .sk { display: block; border-radius: 8px; background: linear-gradient(90deg, var(--surface-2) 25%, color-mix(in srgb, var(--surface-2) 45%, transparent) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shSk 1.3s ease-in-out infinite; }
    @keyframes shSk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* Detail souboru */
    .file-detail-card { display: flex; align-items: center; gap: 24px; padding: 28px; text-align: left; background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow-card); }
    .file-icon { margin: 0; display: flex; width: 88px; height: 88px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 20px; background: var(--surface-2); }
    .file-meta { flex: 1; min-width: 0; }
    .file-name { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 4px; color: var(--text); word-break: break-word; }
    .file-type { font-size: 13px; color: var(--muted); }
    .file-actions { display: flex; gap: 10px; flex-shrink: 0; }
    .action-btn { width: auto; min-height: 44px; padding: 0 20px; margin: 0; border: 0; border-radius: var(--r-ctl); background: var(--surface-2); color: var(--text); font-size: 14px; transition: background 0.15s ease, transform 0.14s var(--ease); }
    .action-btn:hover { background: color-mix(in srgb, var(--surface-2) 70%, var(--muted)); }
    .action-btn:active { transform: scale(0.97); }
    #view-btn:not(.hidden), #view-btn.hidden + .action-btn { background: var(--accent); color: #fff; }
    #view-btn:not(.hidden):hover, #view-btn.hidden + .action-btn:hover { background: var(--accent-press); }

    /* Projekt */
    .projekt-hero { margin-bottom: 22px; }
    .projekt-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow-card); font-size: 13px; color: var(--text); }
    .chip svg { color: var(--muted); }
    /* Dvě logické části: vlevo obsah (popis, harmonogram, program), vpravo stručné informace a podklady */
    .projekt-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
    .pg-main, .pg-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .pg-side { position: sticky; top: 76px; }
    .sk { --sk-a: rgba(120, 120, 128, 0.2); --sk-b: rgba(120, 120, 128, 0.09); background: linear-gradient(90deg, var(--sk-a) 25%, var(--sk-b) 50%, var(--sk-a) 75%); background-size: 200% 100%; }
    .sk-t { height: 11px; width: 140px; margin-bottom: 18px; }
    .sk-l { height: 14px; margin: 12px 0; }
    .sk-k { height: 14px; width: 84px; flex-shrink: 0; }
    .sk-row { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
    .sk-row:last-child { border-bottom: 0; }
    .share-section { background: var(--card); border: 0; border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: 20px 22px; margin: 0; }
    .share-section-title { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; margin-bottom: 12px; }
    .share-section p { font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-line; }
    .share-info-row { border-bottom: 1px solid var(--hair); padding: 9px 0; }
    .share-info-row span:first-child { color: var(--muted); width: 96px; }
    .share-info-row span:last-child { color: var(--text); }
    .share-table { border-collapse: separate; border-spacing: 0; width: 100%; }
    .share-table th { background: none; color: var(--muted); border: 0; border-bottom: 1px solid var(--hair); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 10px 8px 0; }
    .share-table td { border: 0; border-bottom: 1px solid var(--hair); color: var(--text); padding: 10px 10px 10px 0; }
    .share-table tr:last-child td { border-bottom: 0; }
    .podklady-btn { width: auto; padding: 0 22px; }

    /* PDF čtečka */
    .pdf-toolbar { background: rgba(28, 28, 30, 0.92); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); padding-top: env(safe-area-inset-top); height: calc(52px + env(safe-area-inset-top)); }
    .pdf-btn { border-radius: 50%; transition: background 0.15s ease, transform 0.14s var(--spring); }
    .pdf-btn:active { transform: scale(0.88); }
    .pdf-overlay:not(.hidden) { animation: shFade 0.22s ease both; }
    @keyframes shFade { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 900px) { .projekt-grid { grid-template-columns: minmax(0, 1fr) 280px; } }
    @media (max-width: 720px) {
      .page-header { padding: 0 16px; min-height: 54px; }
      .page-header::after { display: none; }
      .page-content { padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
      .page-title { font-size: 23px; }
      .explorer-head { display: none; }
      .explorer-item { grid-template-columns: 36px 1fr 20px; padding: 12px 16px; }
      .explorer-item-type { display: none; }
      .file-detail-card { flex-direction: column; align-items: stretch; text-align: center; padding: 24px 20px; }
      .file-icon { margin: 0 auto; }
      .file-actions { flex-direction: column; }
      .action-btn { width: 100%; }
      .projekt-grid { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
      .pg-main, .pg-side { display: contents; position: static; }
      .sec-info { order: 1; } .sec-wiki { order: 2; } .sec-time { order: 3; } .sec-prog { order: 4; } .sec-pod { order: 5; }
      .share-section { padding: 18px; }
      .pin-page-content { padding: 28px 22px 24px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
  <link rel="stylesheet" href="ui.css">
  <script src="ui.js"></script>
</head>
<body>

  <!-- PIN PAGE -->
  <div id="page-pin">
    <div class="pin-page-content">
      <div class="logo">10<span>space</span></div>
      <div class="subtitle">Sdílený soubor — zadejte PIN kód</div>
      <input type="text" class="pin-input" id="pin-input" maxlength="6" placeholder="••••" inputmode="numeric">
      <button class="primary-btn" onclick="verifyPin()">Otevřít</button>
      <p class="error hidden" id="pin-error"></p>
    </div>
  </div>

  <!-- LOADING PAGE -->
  <div id="page-loading" class="hidden">
    <div class="spinner"></div>
  </div>

  <!-- EXPLORER PAGE -->
  <div id="page-explorer" class="hidden">
    <div class="page-header">
      <button class="page-header-back hidden" id="explorer-back-btn" onclick="explorerGoBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="page-header-title" id="explorer-title"></span>
      <span class="page-header-logo">10<span>space</span></span>
    </div>
    <div class="page-content">
      <nav class="crumbs" id="explorer-crumbs" aria-label="Cesta ve složce"></nav>
      <h1 class="page-title" id="explorer-h1"></h1>
      <div class="page-sub" id="explorer-sub"></div>
      <div class="explorer-list" id="explorer-list"></div>
    </div>
  </div>

  <!-- FILE DETAIL PAGE -->
  <div id="page-file" class="hidden">
    <div class="page-header">
      <button class="page-header-back" id="file-back-btn" onclick="fileGoBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="page-header-title">Soubor</span>
      <span class="page-header-logo">10<span>space</span></span>
    </div>
    <div class="page-content">
      <div class="file-detail-card">
        <div class="file-icon" id="file-icon"></div>
        <div class="file-meta">
          <div class="file-name" id="file-name"></div>
          <div class="file-type" id="file-type"></div>
        </div>
        <div class="file-actions">
          <button class="action-btn" id="view-btn" onclick="viewFile()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Zobrazit
        </button>
          <button class="action-btn" onclick="downloadFile()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Stáhnout
        </button>
        </div>
      </div>
    </div>
  </div>

  <!-- PDF VIEWER -->
  <div class="pdf-overlay hidden" id="pdf-overlay">
    <div class="pdf-toolbar">
      <button class="pdf-btn" onclick="closePdfViewer()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <span class="pdf-title" id="pdf-title"></span>
      <div style="width:36px"></div>
    </div>
    <div class="pdf-canvas-wrap" id="pdf-canvas-wrap"></div>
  </div>

  <!-- PROJEKT PAGE -->
  <div id="page-projekt" class="hidden">
    <div class="page-header">
      <span class="page-header-title" id="projekt-share-title"></span>
      <span class="page-header-logo">10<span>space</span></span>
    </div>
    <div class="page-content">
      <div id="projekt-share-body"></div>
    </div>
  </div>

  <footer class="site-foot">Sdíleno přes <b>10space</b> · 10men</footer>

  <script>
    const FUNCTIONS = {
      verifyShareToken: "https://verifysharetoken-etp6s2ynnq-uc.a.run.app",
      getFileStream: "https://getfilestream-etp6s2ynnq-uc.a.run.app",
      listSharedFolder: "https://listsharedfolder-etp6s2ynnq-uc.a.run.app",
      getSharedProjekt: "https://getsharedprojekt-etp6s2ynnq-uc.a.run.app"
    };

    const shareToken = new URLSearchParams(window.location.search).get("token");

    let rootData = null; // co bylo nasdíleno (soubor nebo složka)
    let explorerPath = []; // [{id, name}] — historie navigace ve složce
    let explorerCameFromProjekt = false;
    let fileData = null; // aktuálně zobrazovaný soubor v detailu
    let cameFromExplorer = false; // jestli se detail souboru otevřel z explorer

    function showPage(id) {
      ["page-pin", "page-loading", "page-explorer", "page-file", "page-projekt"].forEach(p => {
        document.getElementById(p).classList.toggle("hidden", p !== id);
      });
    }

    window.verifyPin = async () => {
      const pin = document.getElementById("pin-input").value;
      if (!pin) return;

      showPage("page-loading");
      document.getElementById("pin-error").classList.add("hidden");

      try {
        const res = await fetch(FUNCTIONS.verifyShareToken, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: shareToken, pin })
        });
        const data = await res.json();

        if (data.success) {
            rootData = data;
          
            if (data.type === "projekt") {
              showPage("page-projekt");
              loadSharedProjekt();
            } else if (data.mimeType === "application/vnd.google-apps.folder") {
              explorerPath = [{ id: data.driveFileId, name: data.nazev }];
              showPage("page-explorer");
              loadSharedFolder(data.driveFileId, data.nazev);
            } else {
              fileData = data;
              cameFromExplorer = false;
              document.getElementById("file-back-btn").classList.add("hidden");
              showFileDetail(data.nazev, data.mimeType);
            }
          } else {
          showPage("page-pin");
          document.getElementById("pin-error").textContent = data.error || "Chyba";
          document.getElementById("pin-error").classList.remove("hidden");
          const pi = document.getElementById("pin-input"); pi.classList.remove("pin-error-shake"); void pi.offsetWidth; pi.classList.add("pin-error-shake");
        }
      } catch(err) {
        showPage("page-pin");
        document.getElementById("pin-error").textContent = "Chyba připojení: " + err.message;
        document.getElementById("pin-error").classList.remove("hidden");
      }
    };

    document.getElementById("pin-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") verifyPin();
    });

    function getFileIconSvg(mimeType, size) {
      const s = size || 48;
      const mime = (mimeType || "").toLowerCase();
    
      if (mimeType === "application/vnd.google-apps.folder") {
        return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#EE220C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
      }
    
      if (mime.includes("image")) return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
    
      if (mime.includes("video")) return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#ff9500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`;
    
      if (mime.includes("audio")) return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#af52de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
    
      // Typ dokumentu
      let label = "";
      let color = "#8e8e93";
    
      if (mime.includes("pdf")) {
        label = "PDF"; color = "#EE220C";
      } else if (
        mime.includes("spreadsheet") ||
        mime.includes("excel") ||
        mime.includes("vnd.ms-excel") ||
        mime.includes("vnd.openxmlformats-officedocument.spreadsheetml")
      ) {
        label = "XLS"; color = "#1e7e34";
      } else if (
        mime.includes("presentation") ||
        mime.includes("powerpoint") ||
        mime.includes("vnd.ms-powerpoint") ||
        mime.includes("vnd.openxmlformats-officedocument.presentationml")
      ) {
        label = "PPT"; color = "#c49200";
      } else if (
        mime.includes("document") ||
        mime.includes("msword") ||
        mime.includes("vnd.openxmlformats-officedocument.wordprocessingml")
      ) {
        label = "DOC"; color = "#2b5eb8";
      }
    
      // Papír se štítkem; rozměry jsou v souřadnicích viewBox (24×24), takže se štítek škáluje s ikonou
      const fontSize = 6;
      const badgeH = 8;
      const badgeY = 11.5;
      const badgeX = 2;
      const badgeW = 20;
    
      return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Papír -->
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="white"/>
        <polyline points="14 2 14 8 20 8" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${label ? `
        <!-- Štítek -->
        <rect x="${badgeX}" y="${badgeY}" width="${badgeW}" height="${badgeH}" rx="1.5" fill="${color}"/>
        <text x="12" y="${badgeY + badgeH * 0.74}" text-anchor="middle" fill="white" font-size="${fontSize}" font-family="system-ui, -apple-system, sans-serif" font-weight="700">${label}</text>
        ` : ""}
      </svg>`;
    }

    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    function typeLabel(mime, isFolder) {
      const m = (mime || "").toLowerCase();
      if (isFolder || m === "application/vnd.google-apps.folder") return "Složka";
      if (m.includes("pdf")) return "Dokument PDF";
      if (m.includes("spreadsheet") || m.includes("excel")) return "Tabulka";
      if (m.includes("presentation") || m.includes("powerpoint")) return "Prezentace";
      if (m.includes("document") || m.includes("msword")) return "Dokument";
      if (m.includes("image")) return "Obrázek";
      if (m.includes("video")) return "Video";
      if (m.includes("audio")) return "Zvuk";
      if (m.includes("zip")) return "Archiv";
      return "Soubor";
    }

    // ===== EXPLORER =====
    async function loadSharedFolder(folderId, folderName) {
      document.getElementById("explorer-title").textContent = rootData?.nazev || folderName;
      document.getElementById("explorer-h1").textContent = folderName;
      document.getElementById("explorer-sub").textContent = "";
      renderCrumbs();
      document.getElementById("explorer-back-btn").classList.toggle("hidden", explorerPath.length <= 1 && !explorerCameFromProjekt);
      document.getElementById("explorer-list").innerHTML = `<div class="explorer-list-sk">${[0, 1, 2, 3, 4].map(() => `<div class="explorer-item" style="cursor:default"><span class="sk" style="width:28px;height:28px"></span><span class="sk" style="height:14px;width:55%"></span><span class="sk" style="height:12px;width:70px"></span><span></span></div>`).join("")}</div>`;

      try {
        const res = await fetch(FUNCTIONS.listSharedFolder, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shareToken, folderId })
        });
        const data = await res.json();

        if (!data.success) {
          document.getElementById("explorer-list").innerHTML = `<div class="explorer-empty">Chyba: ${esc(data.error)}</div>`;
          return;
        }

        if (data.files.length === 0) {
          document.getElementById("explorer-list").innerHTML = `<div class="explorer-empty">Složka je prázdná</div>`;
          return;
        }

        const sorted = data.files.sort((a, b) => {
          if (a.isFolder && !b.isFolder) return -1;
          if (!a.isFolder && b.isFolder) return 1;
          return a.name.localeCompare(b.name, "cs");
        });

        document.getElementById("explorer-sub").textContent = sorted.length === 1 ? "1 položka" : sorted.length >= 2 && sorted.length <= 4 ? sorted.length + " položky" : sorted.length + " položek";
        document.getElementById("explorer-list").innerHTML = `<div class="explorer-head"><span>Název</span><span>Typ</span><span></span></div>` + sorted.map(f => `
          <div class="explorer-item" role="button" tabindex="0" data-id="${esc(f.id)}" data-name="${esc(f.name)}" data-mime="${esc(f.mimeType)}" data-folder="${f.isFolder ? 1 : 0}">
            <span class="ic">${getFileIconSvg(f.isFolder ? "application/vnd.google-apps.folder" : f.mimeType, 28)}</span>
            <span class="explorer-item-name">${esc(f.name)}</span>
            <span class="explorer-item-type">${typeLabel(f.mimeType, f.isFolder)}</span>
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        `).join("");
      } catch(err) {
        document.getElementById("explorer-list").innerHTML = `<div class="explorer-empty">Chyba: ${esc(err.message)}</div>`;
      }
    }

    function renderCrumbs() {
      const el = document.getElementById("explorer-crumbs");
      if (explorerPath.length < 2) { el.innerHTML = ""; return; }
      el.innerHTML = explorerPath.map((p, i) => (i ? `<span class="sep">/</span>` : "") + `<button type="button" data-i="${i}" ${i === explorerPath.length - 1 ? "disabled" : ""}>${esc(p.name)}</button>`).join("");
    }
    document.getElementById("explorer-crumbs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-i]"); if (!b || b.disabled) return;
      explorerPath = explorerPath.slice(0, +b.dataset.i + 1);
      const t = explorerPath[explorerPath.length - 1]; loadSharedFolder(t.id, t.name);
    });
    const openRow = (row) => {
      if (!row) return;
      const { id, name, mime, folder } = row.dataset;
      if (folder === "1") openSharedSubfolder(id, name); else openSharedFile(id, name, mime);
    };
    document.getElementById("explorer-list").addEventListener("click", (e) => openRow(e.target.closest(".explorer-item[data-id]")));
    document.getElementById("explorer-list").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { const r = e.target.closest(".explorer-item[data-id]"); if (r) { e.preventDefault(); openRow(r); } } });

    window.openSharedSubfolder = (folderId, folderName) => {
      explorerPath.push({ id: folderId, name: folderName });
      loadSharedFolder(folderId, folderName);
    };

    window.explorerGoBack = () => {
      if (explorerPath.length <= 1) {
        if (explorerCameFromProjekt) {
          explorerCameFromProjekt = false;
          showPage("page-projekt");
        }
        return;
      }
      explorerPath.pop();
      const target = explorerPath[explorerPath.length - 1];
      loadSharedFolder(target.id, target.name);
    };

    window.openSharedFile = (fileId, fileName, mimeType) => {
      fileData = { driveFileId: fileId, nazev: fileName, mimeType };
      cameFromExplorer = true;
      document.getElementById("file-back-btn").classList.remove("hidden");
      showFileDetail(fileName, mimeType);
    };

    // ===== FILE DETAIL =====
    function showFileDetail(name, mimeType) {
      showPage("page-file");
      document.getElementById("file-name").textContent = name;
      document.getElementById("file-icon").innerHTML = getFileIconSvg(mimeType, 52);
      document.getElementById("file-type").textContent = typeLabel(mimeType);
      document.getElementById("view-btn").classList.toggle("hidden", mimeType !== "application/pdf");
    }

    window.fileGoBack = () => {
      if (cameFromExplorer) {
        showPage("page-explorer");
      } else {
        showPage("page-pin");
        document.getElementById("pin-input").value = "";
      }
    };

    window.downloadFile = async () => {
      if (!fileData) return;
      try {
        const url = `${FUNCTIONS.getFileStream}?driveFileId=${fileData.driveFileId}&shareToken=${shareToken}`;
        const response = await fetch(url);
        const blob = await response.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileData.nazev;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch(err) {
        alert("Chyba při stahování: " + err.message);
      }
    };

    // ===== PDF VIEWER =====
    let pdfDoc = null;
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    window.viewFile = async () => {
      if (!fileData) return;
      document.getElementById("pdf-title").textContent = fileData.nazev;
      document.getElementById("pdf-overlay").classList.remove("hidden");
      document.getElementById("pdf-canvas-wrap").innerHTML = `<div style="color:#fff;text-align:center;padding:40px">Načítám...</div>`;

      try {
        const url = `${FUNCTIONS.getFileStream}?driveFileId=${fileData.driveFileId}&shareToken=${shareToken}`;
        const loadingTask = pdfjsLib.getDocument({ url });
        pdfDoc = await loadingTask.promise;

        const wrap = document.getElementById("pdf-canvas-wrap");
        wrap.innerHTML = "";

        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const page = await pdfDoc.getPage(i);
          const viewport = page.getViewport({ scale: 1.0 });
          const availableWidth = wrap.clientWidth - 32;
          const scale = availableWidth / viewport.width;
          const scaledViewport = page.getViewport({ scale });

          const pageWrap = document.createElement("div");
          pageWrap.style.cssText = "margin-bottom:12px;display:flex;justify-content:center";

          const canvas = document.createElement("canvas");
          const dpr = window.devicePixelRatio || 1;
          canvas.width = scaledViewport.width * dpr;
          canvas.height = scaledViewport.height * dpr;
          canvas.style.width = scaledViewport.width + "px";
          canvas.style.height = scaledViewport.height + "px";
          canvas.style.boxShadow = "0 4px 24px rgba(0,0,0,0.4)";

          const ctx = canvas.getContext("2d");
          ctx.scale(dpr, dpr);
          await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;

          pageWrap.appendChild(canvas);
          wrap.appendChild(pageWrap);
        }
      } catch(err) {
        document.getElementById("pdf-canvas-wrap").innerHTML = `<div style="color:#ff6b6b;text-align:center;padding:40px">Chyba: ${err.message}</div>`;
      }
    };

    window.closePdfViewer = () => {
      document.getElementById("pdf-overlay").classList.add("hidden");
      pdfDoc = null;
    };

    // ===== NASDÍLENÉ PROJEKTY =====
    async function loadSharedProjekt() {
      document.getElementById("projekt-share-title").textContent = rootData.nazev || "Projekt";
      document.getElementById("projekt-share-body").innerHTML = `<div class="projekt-hero"><span class="sk" style="height:32px;width:min(480px,70%)"></span><div class="projekt-chips"><span class="sk" style="height:30px;width:150px;border-radius:999px"></span><span class="sk" style="height:30px;width:130px;border-radius:999px"></span></div></div>
        <div class="projekt-grid" aria-busy="true" aria-label="Načítám projekt">
          <div class="pg-main">
            <div class="share-section sec-wiki"><span class="sk sk-t"></span>${[100, 96, 88, 60].map((w) => `<span class="sk sk-l" style="width:${w}%"></span>`).join("")}</div>
            <div class="share-section sec-time"><span class="sk sk-t"></span>${[0, 1, 2].map(() => `<div class="sk-row"><span class="sk sk-k"></span><span class="sk sk-l" style="flex:1;margin:0"></span></div>`).join("")}</div>
          </div>
          <div class="pg-side">
            <div class="share-section sec-info"><span class="sk sk-t"></span>${[0, 1, 2, 3, 4].map(() => `<div class="sk-row"><span class="sk sk-k"></span><span class="sk sk-l" style="flex:1;margin:0"></span></div>`).join("")}</div>
          </div>
        </div>`;
    
      try {
        const res = await fetch(FUNCTIONS.getSharedProjekt, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shareToken })
        });
        const data = await res.json();
    
        if (!data.success) {
          document.getElementById("projekt-share-body").innerHTML = `<div class="explorer-empty">Chyba: ${esc(data.error)}</div>`;
          return;
        }
    
        const datum = data.datum ? new Date(data.datum).toLocaleDateString("cs-CZ", { day: "numeric", month: "long", year: "numeric" }) : "";
        const ic = (p) => `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
        const row = (l, v) => v ? `<div class="share-info-row"><span>${l}</span><span>${esc(v)}</span></div>` : "";

        const heroHtml = `<div class="projekt-hero"><h1 class="page-title">${esc(data.nazev || rootData.nazev || "Projekt")}</h1>
          <div class="projekt-chips">
            ${datum ? `<span class="chip">${ic('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>')}${esc(datum)}</span>` : ""}
            ${data.misto ? `<span class="chip">${ic('<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>')}${esc(data.misto)}</span>` : ""}
          </div></div>`;

        const infoHtml = `
          <div class="share-section sec-info">
            <div class="share-section-title">Informace o projektu</div>
            ${row("Datum", datum || "—")}${row("Místo", data.misto)}${row("Sraz", data.sraz)}${row("Doprava", data.doprava)}${row("Garant", data.garant)}
          </div>`;

        const wikiHtml = data.wikiText ? `
          <div class="share-section sec-wiki">
            <div class="share-section-title">Popis (AI)</div>
            <p>${esc(data.wikiText)}</p>
          </div>` : "";

        const timelineHtml = data.timeline?.length ? `
          <div class="share-section sec-time">
            <div class="share-section-title">Harmonogram</div>
            ${data.timeline.map(t => `<div class="share-info-row"><span>${esc(t.cas || "—")}</span><span>${esc(t.popis || "")}</span></div>`).join("")}
          </div>` : "";

        const riderHtml = data.harmonogramKoncertu?.length ? `
          <div class="share-section sec-prog">
            <div class="share-section-title">Detailní program</div>
            <table class="share-table">
              <thead><tr><th>Název</th><th>Detail</th><th>Stopáž</th></tr></thead>
              <tbody>
                ${data.harmonogramKoncertu.map(r => {
                  const detail = r.skladby ? r.skladby.map(s => s.name).join(", ") : (r.moderatorJmeno || "");
                  return `<tr><td>${esc(r.nazev || "—")}</td><td>${esc(detail)}</td><td>${r.stopaz_min ? esc(r.stopaz_min) + " min" : "—"}</td></tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>` : "";

        const podkladyHtml = data.hasPodklady ? `
          <div class="share-section sec-pod">
            <div class="share-section-title">Složky projektu</div>
            <button class="primary-btn podklady-btn" onclick="openProjektPodklady()">Otevřít podklady</button>
          </div>` : "";

        document.getElementById("projekt-share-body").innerHTML = heroHtml + `<div class="projekt-grid"><div class="pg-main">${wikiHtml}${timelineHtml}${riderHtml}</div><div class="pg-side">${infoHtml}${podkladyHtml}</div></div>`;
      } catch(err) {
        document.getElementById("projekt-share-body").innerHTML = `<div class="explorer-empty">Chyba připojení: ${esc(err.message)}</div>`;
      }
    }
    
    window.openProjektPodklady = () => {
      explorerCameFromProjekt = true;
      explorerPath = [{ id: rootData.driveFileId || null, name: "Podklady" }];
      loadSharedFolder(explorerPath[0].id, "Podklady");
      showPage("page-explorer");
      document.getElementById("file-back-btn")?.classList.add("hidden");
    };
  </script>
</body>
</html>
